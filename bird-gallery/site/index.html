<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Birds · Seth Reznik</title>
  <meta name="description" content="Bird photography by Seth Reznik, from Brooklyn to Buenos Aires: browse by species and place, with field notes on every bird.">
  <!-- Link previews (iMessage, Slack, social). __SITE_URL__ is filled in at deploy time. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Seth Reznik · Birds">
  <meta property="og:title" content="Seth Reznik · Birds">
  <meta property="og:description" content="Bird photography from Brooklyn to Buenos Aires: browse by species and place, with field notes on every bird.">
  <meta property="og:url" content="__SITE_URL__/">
  <meta property="og:image" content="__SITE_URL__/share.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Kestrel illustration beside photos of an American Kestrel, Northern Cardinal, Great Kiskadee and Yellow-headed Blackbird">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="icon" href="kestrel.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=dev">
</head>
<body>
  <header class="masthead">
    <div class="wrap">
      <div class="brand">
        <a class="home" href="./" aria-label="Home: all photos" tabindex="-1"><img class="mark" src="kestrel.svg" width="88" height="88" alt=""></a>
        <div>
          <h1><a class="home" href="./">Seth Reznik <span class="amp">·</span> <em>Birds</em></a></h1>
          <p class="stats" id="stats">Loading…</p>
        </div>
      </div>
    </div>
  </header>

  <nav class="toolbar" aria-label="Filters">
    <div class="wrap toolbar-inner">
      <div class="tabs" role="tablist">
        <button role="tab" data-view="photos" aria-selected="true">Photos</button>
        <button role="tab" data-view="species" aria-selected="false">Species</button>
        <button role="tab" data-view="places" aria-selected="false">Places</button>
        <a class="tab-link" href="https://ebird.org/profile/ODExMDIzNA" target="_blank" rel="noopener">eBird <span aria-hidden="true">↗</span><span class="sr"> (opens in a new tab)</span></a>
      </div>
      <div class="filters">
        <label class="field search">
          <span class="sr">Search</span>
          <input id="q" type="search" placeholder="Search birds, places…" autocomplete="off">
        </label>
        <label class="field">
          <span class="sr">Species</span>
          <select id="species"><option value="">All species</option></select>
        </label>
        <label class="field">
          <span class="sr">Location</span>
          <select id="place"><option value="">All locations</option></select>
        </label>
        <label class="field">
          <span class="sr">Sort</span>
          <select id="sort">
            <option value="new">Newest first</option>
            <option value="old">Oldest first</option>
            <option value="az">Species A–Z</option>
          </select>
        </label>
      </div>
    </div>
  </nav>

  <main class="wrap">
    <div class="resultbar">
      <p id="summary" aria-live="polite"></p>
      <button id="clear" class="link" hidden>Clear filters</button>
    </div>
    <section id="view-photos" class="grid" aria-label="Photos"></section>
    <section id="view-species" class="cards" aria-label="Species" hidden></section>
    <section id="view-places" class="cards" aria-label="Places" hidden></section>
    <p id="empty" class="empty" hidden>No photos match these filters.</p>
  </main>

  <footer class="wrap foot">
    <p>All photographs © Seth Reznik. Also on <a href="https://www.flickr.com/photos/sethreznik/" rel="noopener">Flickr</a>.</p>
    <p id="updated"></p>
  </footer>

  <dialog id="lightbox" aria-label="Photo details">
    <div class="lb">
      <figure class="lb-media">
        <img id="lb-img" alt="">
        <button class="lb-nav prev" id="lb-prev" aria-label="Previous photo">‹</button>
        <button class="lb-nav next" id="lb-next" aria-label="Next photo">›</button>
        <button class="lb-close" id="lb-close" aria-label="Close" autofocus>×</button>
      </figure>
      <div class="lb-tab" id="lb-tab" aria-hidden="true"></div>
      <aside class="lb-info" id="lb-info"></aside>
    </div>
  </dialog>

  <script src="app.js?v=dev"></script>
</body>
</html>
