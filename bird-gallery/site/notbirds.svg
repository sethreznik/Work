<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="City buildings at dusk">
  <defs>
    <clipPath id="c-disc"><circle cx="100" cy="100" r="96"/></clipPath>
  </defs>
  <g clip-path="url(#c-disc)">
    <!-- dusk sky in flat bands -->
    <rect width="200" height="200" fill="#3e4c78"/>
    <rect y="58" width="200" height="34" fill="#6f5a8e"/>
    <rect y="92" width="200" height="30" fill="#c96a5e"/>
    <rect y="122" width="200" height="78" fill="#e8a457"/>
    <!-- setting sun -->
    <circle cx="146" cy="118" r="27" fill="#f4c95d"/>
    <!-- distant skyline -->
    <path d="M0 150 H14 V132 H26 V146 H34 V124 H44 V150 H200 V200 H0 Z" fill="#6a5675"/>
    <path d="M150 150 V128 H160 V118 H170 V136 H182 V126 H194 V150 Z" fill="#6a5675"/>

    <!-- tall tower -->
    <rect x="44" y="40" width="40" height="160" fill="#2c3550"/>
    <rect x="58" y="26" width="12" height="16" fill="#2c3550"/>
    <rect x="63" y="12" width="2" height="16" fill="#2c3550"/>
    <g fill="#f4c95d">
      <rect x="50" y="52" width="6" height="8"/><rect x="61" y="52" width="6" height="8"/><rect x="72" y="52" width="6" height="8" fill="#4d5a7e"/>
      <rect x="50" y="68" width="6" height="8" fill="#4d5a7e"/><rect x="61" y="68" width="6" height="8"/><rect x="72" y="68" width="6" height="8"/>
      <rect x="50" y="84" width="6" height="8"/><rect x="61" y="84" width="6" height="8" fill="#4d5a7e"/><rect x="72" y="84" width="6" height="8" fill="#4d5a7e"/>
      <rect x="50" y="100" width="6" height="8" fill="#4d5a7e"/><rect x="61" y="100" width="6" height="8"/><rect x="72" y="100" width="6" height="8"/>
      <rect x="50" y="116" width="6" height="8"/><rect x="61" y="116" width="6" height="8"/><rect x="72" y="116" width="6" height="8" fill="#4d5a7e"/>
      <rect x="50" y="132" width="6" height="8" fill="#4d5a7e"/><rect x="61" y="132" width="6" height="8" fill="#4d5a7e"/><rect x="72" y="132" width="6" height="8"/>
      <rect x="50" y="148" width="6" height="8"/><rect x="61" y="148" width="6" height="8"/><rect x="72" y="148" width="6" height="8"/>
    </g>

    <!-- brick building with a water tower -->
    <rect x="84" y="104" width="40" height="96" fill="#9a4a3a"/>
    <g stroke="#3a2a2a" stroke-width="2">
      <line x1="96" y1="104" x2="99" y2="90"/><line x1="112" y1="104" x2="109" y2="90"/>
    </g>
    <rect x="95" y="76" width="18" height="15" rx="2" fill="#7a5238"/>
    <path d="M93 77 L104 66 L115 77 Z" fill="#3a2a2a"/>
    <g fill="#3a2a2a"><rect x="95" y="80" width="18" height="2"/><rect x="95" y="86" width="18" height="2"/></g>
    <g fill="#f4c95d">
      <rect x="90" y="114" width="7" height="9"/><rect x="101" y="114" width="7" height="9" fill="#6e3428"/><rect x="112" y="114" width="7" height="9"/>
      <rect x="90" y="130" width="7" height="9" fill="#6e3428"/><rect x="101" y="130" width="7" height="9"/><rect x="112" y="130" width="7" height="9" fill="#6e3428"/>
      <rect x="90" y="146" width="7" height="9"/><rect x="101" y="146" width="7" height="9"/><rect x="112" y="146" width="7" height="9"/>
    </g>

    <!-- slate building -->
    <rect x="124" y="126" width="44" height="74" fill="#4f6d8f"/>
    <rect x="124" y="122" width="44" height="5" fill="#3d5774"/>
    <g fill="#f4c95d">
      <rect x="130" y="134" width="8" height="6" fill="#3d5774"/><rect x="142" y="134" width="8" height="6"/><rect x="154" y="134" width="8" height="6" fill="#3d5774"/>
      <rect x="130" y="146" width="8" height="6"/><rect x="142" y="146" width="8" height="6" fill="#3d5774"/><rect x="154" y="146" width="8" height="6"/>
      <rect x="130" y="158" width="8" height="6" fill="#3d5774"/><rect x="142" y="158" width="8" height="6"/><rect x="154" y="158" width="8" height="6"/>
    </g>

    <!-- street -->
    <rect y="176" width="200" height="24" fill="#232a3d"/>
    <g fill="#e8a457"><rect x="16" y="186" width="16" height="3"/><rect x="52" y="186" width="16" height="3"/><rect x="88" y="186" width="16" height="3"/><rect x="124" y="186" width="16" height="3"/><rect x="160" y="186" width="16" height="3"/></g>
  </g>
</svg>
